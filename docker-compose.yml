services:
  app:
    build: .
    container_name: specwise-app
    restart: unless-stopped
    ports:
      - "0.0.0.0:${PORT:-8999}:8999"
    env_file:
      - .env
    environment:
      PORT: 8999
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-specwise_db}?schema=public
      MINIO_ENDPOINT: minio
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg16
    container_name: specwise-postgres
    restart: unless-stopped
    ports:
      # Bind to localhost only: the database must not be reachable from
      # other hosts on the network.
      - "127.0.0.1:5434:5432"
    environment:
      # No default credentials: these MUST be supplied via environment or .env
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in your environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      POSTGRES_DB: ${POSTGRES_DB:-specwise_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: specwise-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"   # S3 API (localhost only)
      - "127.0.0.1:9001:9001"   # Web Console (localhost only)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in your environment}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in your environment}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  pgdata:
  minio_data:
